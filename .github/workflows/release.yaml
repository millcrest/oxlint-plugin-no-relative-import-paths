name: Publish to npm
run-name: Publish ${{ github.ref_name }}

# Triggered by pushing a version tag, which `vp run release` (bumpp) creates.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          version-file: package.json
          cache: true
          run-install: true

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Build
        run: vp pack

      - name: Pack tarball
        run: pn pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm
        working-directory: ${{ runner.temp }}
        run: |
          tarball="$(ls "$RUNNER_TEMP"/oxlint-plugin-no-relative-import-paths-*.tgz)"
          echo "Publishing $tarball"
          pnpm publish "$tarball" --access public
